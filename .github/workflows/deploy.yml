name: Deploy Portfolio

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  DOCKER_IMAGE: snitsweb/images
  IMAGE_NAME: portfolio

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract commit hash
        id: vars
        run: echo "COMMIT_HASH=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_NAME }}-latest
            ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_NAME }}-${{ steps.vars.outputs.COMMIT_HASH }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update Kubernetes deployment
        run: |
          kubectl patch deployment portfolio \
            -p '{"spec":{"template":{"spec":{"containers":[{"name":"portfolio","image":"${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_NAME }}-${{ steps.vars.outputs.COMMIT_HASH }}"}]}}}}'

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/portfolio --timeout=300s
